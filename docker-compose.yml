# version: "3.9"

services:

  nginx:
    build: ./srcs/requirements/nginx
    restart: always
    ports:
      # connects localhost:8080  ──►  port 80 (speciified in nginx Dockerfile) // TO BE CHANGED to "443:443"
      - "8080:80"
    # tells Compose to check first if wordpress container has been started
    depends_on:
      - wordpress
    networks:
      - inception

  wordpress:
    build: ./srcs/requirements/wordpress
    restart: always

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: mariadb

      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}

      WP_SECOND_USER: ${WP_SECOND_USER}
      WP_SECOND_PASSWORD: ${WP_SECOND_PASSWORD}
      WP_SECOND_EMAIL: ${WP_SECOND_EMAIL}

    depends_on:
      - mariadb

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - inception


  mariadb:    
    build: ./srcs/requirements/mariadb
    restart: always
    
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    
volumes:
  mariadb_data:
  wordpress_data:


networks:
  inception: